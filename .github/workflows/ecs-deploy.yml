name: ECS CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout
      uses: actions/checkout@v4

    # 2️⃣ Configure AWS credentials
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # 3️⃣ Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4️⃣ Build & Push Docker Image
    - name: Build and Push Image
      run: |
        IMAGE_TAG=${{ github.sha }}
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        docker build -t ${{ secrets.DOCKER_USERNAME }}/my-nginx:$IMAGE_TAG .
        docker push ${{ secrets.DOCKER_USERNAME }}/my-nginx:$IMAGE_TAG

    # 5️⃣ Get current ECS task definition
    - name: Get current task definition
      run: |
        aws ecs describe-task-definition \
          --task-definition tf-nginx-task \
          --query taskDefinition > task-def.json

    # 6️⃣ Clean unwanted fields
    - name: Clean task definition
      run: |
        cat task-def.json | jq 'del(
          .taskDefinitionArn,
          .revision,
          .status,
          .requiresAttributes,
          .compatibilities,
          .registeredAt,
          .registeredBy
        )' > clean-task-def.json

    # 7️⃣ Update image in task definition
    - name: Update image
      run: |
        jq --arg IMAGE "${{ secrets.DOCKER_USERNAME }}/my-nginx:${{ env.IMAGE_TAG }}" \
        '.containerDefinitions[0].image = $IMAGE' clean-task-def.json > final-task-def.json

	- name: Get latest task definition revision
	  id: task-def
	  run: |
		TASK_DEF_ARN=$(aws ecs list-task-definitions \
		  --family-prefix tf-nginx-task \
		  --sort DESC \
		  --query 'taskDefinitionArns[0]' \
		  --output text)

		echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

	- name: Deploy to ECS
	  run: |
		aws ecs update-service \
	      --cluster tf-ecs-cluster \
		  --service tf-ecs-service \
		  --task-definition $TASK_DEF_ARN \
		  --force-new-deployment
